<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valentine?</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card" id="card">
    <div class="hearts" id="hearts" aria-hidden="true"></div>

    <h1>Hey <span class="name" id="herName"> Dodo </span> 💘</h1>
    <p class="subtitle">Will you be my Valentine?</p>

    <section class="btns" id="btnArea" aria-label="Valentine choices">
      <button id="yes" type="button">YES 💖</button>
      <button id="no" type="button">NO 😭</button>
    </section>

    <section class="result" id="result" aria-live="polite">
      <p class="big">YAAAY!! 🥹💞</p>
      <p class="small" id="finalLine">You just made my day.</p>
    </section>

    <p class="footer">Made with ❤️ By DeXe.RaR </p>
  </main>

  <script src="script.js" defer></script>
</body>
<div class="bg-hearts" id="bgHearts"></div>
<div class="bg-sparkles" id="bgSparkles"></div>
</html>
